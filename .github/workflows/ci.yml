name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    name: Testes PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, mbstring
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  mysql:
    name: MySQL sem Composer (como na Hostinger)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: docegestao
          MYSQL_USER: docegestao
          MYSQL_PASSWORD: senha-do-ci
          MYSQL_ROOT_PASSWORD: root-do-ci
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring
      - name: config.php como no servidor
        run: |
          cat > config.php <<'PHP'
          <?php
          return ['DB_DSN' => 'mysql:host=127.0.0.1;dbname=docegestao;charset=utf8mb4', 'DB_USER' => 'docegestao', 'DB_PASSWORD' => 'senha-do-ci'];
          PHP
      - run: ADMIN_EMAIL=ci@exemplo.com ADMIN_PASSWORD=senha-do-ci php bin/setup.php
      - run: php bin/setup.php   # rodar de novo não pode quebrar
      - run: php -S localhost:8080 -t public public/index.php > /tmp/server.log 2>&1 &
      - run: sleep 2
      - name: Sistema responde e exige login
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/login)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = "303"
      - if: failure()
        run: cat /tmp/server.log
